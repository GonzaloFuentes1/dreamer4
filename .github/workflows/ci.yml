name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The unit tests only need torch and pytest; the full training stack
      # (Lightning, Hydra, TorchRL, DMControl, ...) is not installed.
      - name: Install CPU torch and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff==0.17.1

      # Lint is limited to tests/: the existing sources are not formatted to
      # ruff's rules and are left untouched.
      - name: Lint tests
        run: ruff check tests

      - name: Run unit tests
        run: python -m pytest tests -q
