# configs/agent/large_64x64.yaml
# Phase 3 — imagination training para large_64x64 dynamics.
# Requiere checkpoint de Phase-2 entrenado con finetune/large_64x64.

finetune_ckpt: ???

# ---- Dynamics architecture (must match finetune/large_64x64) -----------------
packing_factor: 2
d_model_dyn: 896
dyn_depth: 12
n_heads: 8
dropout: 0.0
mlp_ratio: 4.0
time_every: 4
n_register: 8
n_agent: 1
space_mode: wm_agent_read   # fases 2-3: el agente DEBE ver la imagen (paper 3.3)
k_max: 8
tau_ctx: 0.9              # nivel de senal del contexto en inferencia (paper p.6)

# ---- Task conditioning (must match Phase-2) ----------------------------------
use_task_ids: false
n_tasks: 128
mtp_length: 8

# ---- Agent head architecture -------------------------------------------------
hidden_dim: 896
action_dim: 16

# ---- Imagination rollout -----------------------------------------------------
imagination_horizon: 15
ctx_length: 16
imagination_batch_size: 16
max_ctx_len: 32
eval_schedule: shortcut
eval_d: 0.5

# ---- RL hyperparameters (eqs. 10-11) ----------------------------------------
gamma: 0.997
lambda_: 0.95
alpha: 0.5
beta: 0.3
critic_coef: 1.0

# ---- Optimizer ---------------------------------------------------------------
lr: 5.0e-5
weight_decay: 1.0e-5
warmup_steps: 500
lr_schedule: constant_with_warmup
grad_clip: 10.0

# ---- Evaluation / logging ----------------------------------------------------
eval_every: 5000
eval_n_episodes: 1
eval_episode_len: 500

# --- transformer eficiente (Dreamer 4, seccion 3.4) ---
qk_norm: true             # RMSNorm sobre q,k: "to increase training stability"
soft_cap: 50.0            # acotado tanh de logits; 0 lo desactiva y reactiva flash-attn
use_rope: true            # RoPE en vez de sinusoidal aditivo
n_kv_heads: null          # GQA: p.ej. n_heads/4. null = sin GQA
