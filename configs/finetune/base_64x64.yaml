# configs/finetune/base_64x64.yaml
# Phase 2 — finetuning (BC + reward) for base_64x64 dynamics.
# Architecture must match dynamics/base_64x64 exactly.

tokenizer_ckpt: ???
dynamics_ckpt: ???
packing_factor: 2

# Architecture (must match dynamics/base_64x64)
d_model_dyn: 768
dyn_depth: 8
n_heads: 8
dropout: 0.0
scale_pos_embeds: false
mlp_ratio: 4.0
time_every: 4
n_register: 4
n_agent: 1
space_mode: wm_agent_read   # fases 2-3: el agente DEBE ver la imagen (paper 3.3)
k_max: 8

# Shortcut / bootstrap (same as Phase 1)
bootstrap_start: 3000
self_fraction: 0.25
use_actions: true

use_task_ids: false
n_tasks: 128
mtp_length: 8

# Finetuning network
hidden_dim: 512
action_dim: 16

lr: 3.0e-4
weight_decay: 1.0e-2
warmup_steps: 500
lr_schedule: constant_with_warmup
grad_clip: 1.0
eval_every: 10000
eval_batch_size: 4
eval_max_items: 4
eval_ctx: 8
eval_horizon: 16
eval_schedule: shortcut
eval_d: 0.25

# --- transformer eficiente (Dreamer 4, seccion 3.4) ---
qk_norm: true             # RMSNorm sobre q,k: "to increase training stability"
soft_cap: 50.0            # acotado tanh de logits; 0 lo desactiva y reactiva flash-attn
use_rope: true            # RoPE en vez de sinusoidal aditivo
n_kv_heads: null          # GQA: p.ej. n_heads/4. null = sin GQA
